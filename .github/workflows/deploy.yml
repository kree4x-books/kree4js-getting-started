name: Deploy GitBook to ECS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install honkit into the project's local node_modules (not global).
      # HonKit resolves plugins via require.resolve from its own module dir,
      # so a plugin symlink only works when honkit lives in the project node_modules.
      - name: Install dependencies
        run: npm ci

      # Create the theme symlink AFTER npm ci, otherwise npm would remove it.
      - name: Link local theme
        run: |
          ln -sfn ../themes/gitbook-theme-icp node_modules/gitbook-plugin-theme-icp

      - name: Build GitBook
        run: npm exec -- honkit build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to ECS
        env:
          BOOK_NAME: ${{ github.event.repository.name }}
        run: |
          rm -rf _book/.github _book/.gitignore
          rm -f _book/.npmrc _book/.nvmrc _book/eslint.config.mjs \
                _book/package.json _book/package-lock.json \
                _book/tsconfig.base.json _book/tracing.svg
          rm -rf _book/.vscode
          tar czf _book.tar.gz -C _book .
          tar czf examples.tar.gz -C examples .
          scp -i ~/.ssh/deploy_key _book.tar.gz examples.tar.gz \
            ${{ vars.ECS_USER }}@${{ vars.ECS_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key ${{ vars.ECS_USER }}@${{ vars.ECS_HOST }} \
            "mkdir -p /var/www/books/${BOOK_NAME} && \
             cd /var/www/books/${BOOK_NAME} && rm -rf * && \
             tar xzf /tmp/_book.tar.gz && \
             mkdir -p examples && cd examples && tar xzf /tmp/examples.tar.gz && \
             rm -f /tmp/_book.tar.gz /tmp/examples.tar.gz"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key