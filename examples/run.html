<!DOCTYPE html>
<html lang="cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kree4JS 在线运行</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1117;
      color: #c9d1d9;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #f85149; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <p id="status">正在加载示例...</p>
  </div>

  <script src="https://unpkg.com/@stackblitz/sdk/bundles/sdk.umd.js"></script>
  <script>
    (async function () {
      const statusEl = document.getElementById('status')
      const spinnerEl = document.getElementById('spinner')

      function setError(msg) {
        spinnerEl.style.display = 'none'
        statusEl.className = 'error'
        statusEl.textContent = msg
      }

      const params = new URLSearchParams(window.location.search)
      const file = params.get('file')
      if (!file) {
        setError('缺少 file 参数')
        return
      }

      statusEl.textContent = '正在加载 ' + file + ' ...'

      try {
        const base = window.location.href.replace(/[^/]*$/, '')
        const fileRes = await fetch(base + file)

        if (!fileRes.ok) {
          setError('文件不存在: ' + file)
          return
        }

        const fileContent = await fileRes.text()
        const pkgContent = JSON.stringify({
          name: 'kree4js-example',
          type: 'module',
          dependencies: {
            '@kree4js/commons-logging': '^1.0.0',
            '@kree4js/kree4n': '^1.0.0'
          }
        }, null, 2)

        const fileName = file.split('/').pop()

        spinnerEl.style.display = 'none'
        statusEl.textContent = '正在打开 StackBlitz...'

        StackBlitzSDK.openProject(
          {
            title: fileName.replace(/\.m?js$/, ''),
            description: 'Kree4JS Example',
            template: 'node',
            files: {
              'index.mjs': fileContent,
              'package.json': pkgContent
            }
          },
          { openFile: 'index.mjs' }
        )
      } catch (err) {
        setError('加载失败: ' + err.message)
      }
    })()
  </script>
</body>
</html>
